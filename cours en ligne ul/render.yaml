services:
  - type: web
    name: doccampus
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DOCCAMPUS_SECRET_KEY
        generateValue: true
      - key: DOCCAMPUS_DATABASE
        value: /data/doccampus.sqlite3
      - key: DOCCAMPUS_UPLOADS
        value: /data/uploads
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUBMISSION_NOTIFICATION_EMAIL
        value: adolpheamegnekou0@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: adolpheamegnekou0@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: adolpheamegnekou0@gmail.com
      - key: DOCCAMPUS_PUBLIC_URL
        sync: false
    disk:
      name: doccampus-data
      mountPath: /data
      sizeGB: 1
